server:
  port: 8080

spring:
  application:
    name: backend

  profiles:
    # 기본 활성 프로파일은 dev로 설정
    active: dev

  config:
    import: optional:application-secret.yml

  mvc:
    async:
      request-timeout: 600000  # SSE 연결 타임아웃 설정 (밀리초)

  # h2
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  # security
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${oauth.kakao.client-id}
            client-secret: ${oauth.kakao.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT 설정
jwt:
  secret: # secret.yml
  # access-token-expiration: 각 환경별 설정
  # refresh-token-expiration: 각 환경별 설정

# logging
logging:
  level:
    org.springframework.security: DEBUG
    com.ddobang.backend: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE

# swagger
springdoc:
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
  default-produces-media-type: application/json
  paths-to-match: /**

# Custom settings
custom:
  sse:
    timeout: 600000  # SSE 타임아웃 설정 (밀리초, 10분)
